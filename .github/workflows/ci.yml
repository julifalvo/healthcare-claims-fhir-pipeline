name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit-tests:
    name: Unit & Spark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: pytest (generator, FHIR conformance, DQ rules, SCD2, end-to-end idempotency)
        run: uv run pytest -v

  airflow-e2e:
    name: Airflow end-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: DAG integrity tests (inside the Airflow image)
        run: >
          docker run --rm -v "$PWD/tests:/opt/airflow/project/tests"
          -v "$PWD/dags:/opt/airflow/project/dags" -w /opt/airflow/project
          --entrypoint python claims-airflow:local -m pytest -p no:cacheprovider tests/dags -v
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Run claims_lakehouse and the asset-triggered denials_worklist
        run: ./scripts/ci_e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 airflow-scheduler airflow-apiserver
      - name: Tear down
        if: always()
        run: docker compose down -v
